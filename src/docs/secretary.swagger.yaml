tags:
  - name: Secretaries
    description: >
      Secretários. Leitura (listar/buscar): qualquer usuário autenticado, qualquer papel.
      Criação, edição e exclusão: somente ADMIN. Cada secretário está vinculado 1:1 a um User
      com role SECRETARY (via userId).

paths:
  /api/secretary:
    get:
      tags: [Secretaries]
      summary: Lista todos os secretários
      description: Retorna todos os secretários cadastrados, incluindo o usuário vinculado e os agendamentos que marcaram.
      responses:
        200:
          description: Lista de secretários.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Secretary"
        401:
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Secretaries]
      summary: Cadastra um secretário (somente ADMIN)
      description: >
        Vincula um registro Secretary a um User existente. Regras validadas pelo service (não
        pelo Zod): o userId deve pertencer a um usuário com role SECRETARY (caso contrário 400)
        e esse usuário ainda não pode ter um registro de secretário (caso contrário 409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSecretaryRequest"
      responses:
        201:
          description: Secretário criado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Secretary"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        409:
          $ref: "#/components/responses/Conflict"

  /api/secretary/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      tags: [Secretaries]
      summary: Busca um secretário pelo ID
      responses:
        200:
          description: Secretário encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Secretary"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        404:
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Secretaries]
      summary: Atualiza um secretário (somente ADMIN)
      description: >
        Todos os campos do corpo são opcionais (shift, workStatus). O userId vinculado não pode
        ser alterado por esta rota. Como nenhum campo aceito aqui é único, esta operação nunca
        retorna 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSecretaryRequest"
      responses:
        200:
          description: Secretário atualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Secretary"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Secretaries]
      summary: Remove um secretário (somente ADMIN)
      description: >
        Remove apenas o registro Secretary (não remove o User vinculado). Os agendamentos que
        este secretário marcou não são removidos: o campo secretaryId é automaticamente definido
        como null nesses agendamentos (relação onDelete SetNull). Observação de implementação:
        diferente dos demais recursos, esta rota verifica a existência do registro antes de
        deletar e lança um erro genérico (não um HttpError com status definido) quando o ID não
        existe; isso é tratado pelo handler de erros global como 500 em vez do 404 usado nos
        outros recursos — ao consumir esta rota, trate tanto 404 quanto 500 como "não encontrado".
      responses:
        204:
          description: Secretário removido (sem conteúdo).
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
