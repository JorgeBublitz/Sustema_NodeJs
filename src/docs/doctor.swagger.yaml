tags:
  - name: Doctors
    description: >
      Médicos. Leitura (listar/buscar): qualquer usuário autenticado, qualquer papel. Criação,
      edição e exclusão: somente ADMIN. Cada médico está vinculado 1:1 a um User com role DOCTOR
      (via userId); crmNumber + crmState devem ser únicos em conjunto.

paths:
  /api/doctor:
    get:
      tags: [Doctors]
      summary: Lista todos os médicos
      description: Retorna todos os médicos cadastrados, incluindo o usuário vinculado e os agendamentos em que participam.
      responses:
        200:
          description: Lista de médicos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Doctor"
        401:
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Doctors]
      summary: Cadastra um médico (somente ADMIN)
      description: >
        Vincula um registro Doctor a um User existente. Regras validadas pelo service (não pelo
        Zod): o userId deve pertencer a um usuário com role DOCTOR (caso contrário 400) e esse
        usuário ainda não pode ter um registro de médico (caso contrário 409). O par
        crmNumber + crmState deve ser único; se já usado por outro médico, retorna 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDoctorRequest"
      responses:
        201:
          description: Médico criado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Doctor"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        409:
          $ref: "#/components/responses/Conflict"

  /api/doctor/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      tags: [Doctors]
      summary: Busca um médico pelo ID
      responses:
        200:
          description: Médico encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Doctor"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        404:
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Doctors]
      summary: Atualiza um médico (somente ADMIN)
      description: >
        Todos os campos do corpo são opcionais. O userId vinculado não pode ser alterado por
        esta rota. Se crmNumber/crmState forem alterados para uma combinação já usada por outro
        médico, retorna 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDoctorRequest"
      responses:
        200:
          description: Médico atualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Doctor"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        409:
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Doctors]
      summary: Remove um médico (somente ADMIN)
      description: >
        Remove apenas o registro Doctor (não remove o User vinculado). Os vínculos deste médico
        em agendamentos (tabela de junção AppointmentDoctor) são removidos automaticamente em
        cascata pelo banco; os agendamentos em si permanecem, apenas sem este médico associado.
      responses:
        204:
          description: Médico removido (sem conteúdo).
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
